version = 1

# Prose and metadata where a header would end up in the rendered output
# (e.g., README shown on GitHub) or which can not carry a comment.
[[annotations]]
path = [
    "AUTHORS",
    "README.md",
    "CONTRIBUTING.md",
    "dev_scripts/semantic-patching/README.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.0-java AUTHORS"
SPDX-License-Identifier = "MIT"

# The snippets are inserted verbatim into the generated code by aas-core-codegen,
# so they must not carry a header of their own.
[[annotations]]
path = "dev_scripts/codegen/snippets/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.0-java AUTHORS"
SPDX-License-Identifier = "MIT"

# Test data and the recorded test outputs are generated and compared
# byte-by-byte, JSON can not carry a comment, and the update script reads
# the revision file.
[[annotations]]
path = ["test_data/**", "src/test/java/testgen_rev.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.0-java AUTHORS"
SPDX-License-Identifier = "MIT"
